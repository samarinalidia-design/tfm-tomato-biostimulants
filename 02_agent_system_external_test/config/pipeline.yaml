assumptions:
  # Study-specific A399 author decisions do not carry over. New exceptions need a recorded author decision.
  # Author decision 2026-11-15 (Lidiia Samarina): boxplot centre lines are used as the mean
  # (BOX_CENTRE_ASSUMED_MEAN, separate A_box_centre_assumed mart). P2 duplicate slots stay closed as duplicates.
  box_centre_as_mean_slots: [T021#02, T081#02, T081#06, T081#07, T081#09, T081#11, T087#01, T087#02, T110#01, T110#02]
  per_plant_context_assumed: []
  # Author decision 2026-11-15 (Lidiia Samarina): when the original does not print a first-online date,
  # the printed final publication (issue) date is used and the article is retained, not quarantined.
  temporal_final_publication_date:
    T022: {issue: 'Journal of Basic Microbiology 2025; 65:e2400595', year: 2025}
    T053: {issue: 'Turkish Journal of Agricultural and Natural Sciences 12(4):1120-1128, 2025', year: 2025}
    T057: {issue: 'The Plant Journal (2025) 123, e70432 (issue 4)', year: 2025}
    T068: {issue: 'Physiologia Plantarum 2026; 178:e70762', year: 2026}
    T082: {issue: 'Revista Argentina de Microbiologia 59 (2027) 100743; accepted 13 July 2026', year: 2027, note: 'volume year after window end; retained by explicit author instruction'}
  # Author decision 2026-11-15: supplements cited but not registered in the source manifest are not
  # included; slots whose only source is such a supplement are closed NOT_EXTRACTABLE.
  missing_supplements_excluded: true
  # Author decision 2026-11-18: assets whose only source is an unregistered supplement are not
  # counted by the relevant_assets_represented gate.
  unregistered_supplement_assets: [T104_ESM_FigS1S2_shoot_DM, T104_ESM_FigS1S2_root_DM]
  # Author decision 2026-11-15: on a contradiction between figure/table data and prose, figure and
  # table values take priority (table/supplementary table over figure, figure over prose).
  contradiction_priority: [SUPP_TABLE, TABLE, FIGURE, TEXT]
