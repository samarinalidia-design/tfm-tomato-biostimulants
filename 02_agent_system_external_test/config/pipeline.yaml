  full_original_inventory_required: true
  search_mode: SEMANTIC_PLUS_NON_EXHAUSTIVE_TERMS
  primary: FRUIT_YIELD
  secondary: DRY_BIOMASS
  candidate_terms:
  - yield
  - harvest
  - harvested fruit mass
  - fruit production
  - crop production
  - crop productivity
  - fruit productivity
  - total fruit weight
  - total fruit fresh weight
  - cumulative fruit mass
  - marketable production
  - marketable fruit weight
  - commercial yield
  - economic yield
  - early production
  - fruit mass per plant
  - harvested mass per plot
  - rendimiento
  - cosecha
  - producción de frutos
  - produtividade
  - produção de frutos
  - colheita
  - rendement
  - récolte
  - Ertrag
  - Ernte
  - урожайность
  - сбор плодов
  lexicon_is_exhaustive: false
  qualification_rule: Interpret the original measurement, units, plant/area/plot denominator and harvest period; a keyword alone never defines fruit yield.
  non_substitutes:
  - harvest date or days to harvest
  - harvest index or a ratio alone
  - fruit number alone
  - mean individual fruit mass alone
  - vegetative fresh or dry biomass
  - extract, DNA or metabolite yield
  all_registered_originals_required: true
  old_extraction_completeness: NOT_APPLICABLE
targets:
