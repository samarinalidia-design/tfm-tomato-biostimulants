  - MEAN_FRUIT_MASS
  - WATER_PRODUCTIVITY
  extract_secondary_productivity: true
  digitize_auxiliary_figures: false
  relevance_rule: Keep targets, required context, estimands, QA and pre-treatment
    predictors only; exclude omics arrays and unrelated numerical outcomes.
  exclude_payloads:
  - transcriptomics_matrix
  - metabolomics_matrix
  - proteomics_matrix
  - sequencing_reads
  - unrelated_physiology
  biotic_secondary:
  - BIOTIC_SEVERITY
  - BIOTIC_INCIDENCE
  - BIOTIC_PATHOGEN_LOAD
  - BIOTIC_LESION_AREA
  - BIOTIC_MORTALITY
  - BIOTIC_SURVIVAL
  - BIOTIC_ROOT_GALL
