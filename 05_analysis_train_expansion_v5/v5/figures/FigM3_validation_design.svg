   <g id="text_1">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="7.5096" y="12.9492" transform="rotate(-0 7.5096 12.9492)">Outer loop: 5 folds of dependency clusters (studies sharing controls/authors kept together), × 3 random seeds</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="232.0416" y="40.562246" transform="rotate(-0 232.0416 40.562246)">fold 1</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="232.0416" y="66.436886" transform="rotate(-0 232.0416 66.436886)">fold 2</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="232.0416" y="92.311526" transform="rotate(-0 232.0416 92.311526)">fold 3</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="232.0416" y="118.186166" transform="rotate(-0 232.0416 118.186166)">fold 4</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="232.0416" y="144.060806" transform="rotate(-0 232.0416 144.060806)">fold 5</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(12.4992 189.25732)">orange = validation studies (never seen in training)</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(12.4992 196.42392)">blue = training studies</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="284.4324" y="39.894172" transform="rotate(-0 284.4324 39.894172)">Inside each training part (inner loop)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(284.4324 53.247769)">3 inner folds by cluster: choose hyper-parameters,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(284.4324 61.641319)">encoders, stack weights and interval width</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(284.4324 70.034869)">weights 1/(v + τ²); no information from</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(284.4324 78.428419)">the validation studies is used</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="284.4324" y="148.097212" transform="rotate(-0 284.4324 148.097212)">Freeze → one external test</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(284.4324 161.450809)">selection rule fixed in advance (lowest CV error,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(284.4324 169.844359)">simpler model within 1 %) → refit on all TRAIN →</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(284.4324 178.237909)">MODEL_FREEZE (SHA-256) → TEST 2024-2026 evaluated</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(284.4324 186.815021)">once: POST_HOC_TEST_REUSE (corpus used before)</text>
   </g>
  </g>
 </g>
