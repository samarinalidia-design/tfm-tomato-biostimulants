   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="13.49712" y="25.385813" transform="rotate(-0 13.49712 25.385813)">1 Frozen corpus</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(13.49712 33.232031)">manifest of full texts</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(13.49712 40.88133)">and supplements;</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(13.49712 48.530628)">study_id / file_id</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="112.2912" y="25.385813" transform="rotate(-0 112.2912 25.385813)">2 Local extraction</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(112.2912 33.232031)">Docling (tables),</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(112.2912 40.88133)">PyMuPDF, RapidOCR*,</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(112.2912 48.530628)">pandas/openpyxl</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(112.2912 56.179927)">*only if no text layer</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="211.08528" y="25.385813" transform="rotate(-0 211.08528 25.385813)">3 Study package</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(211.08528 33.232031)">text, tables, figures,</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(211.08528 40.88133)">quantitative candidates,</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(211.08528 48.530628)">locators (page/table/</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(211.08528 56.179927)">figure/cell)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="309.87936" y="25.385813" transform="rotate(-0 309.87936 25.385813)">4 Structuring</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(309.87936 33.232031)">experiments, arms,</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(309.87936 40.88133)">stress, products, doses,</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(309.87936 48.530628)">measurements (JSON</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(309.87936 56.179927)">schema V4.4)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="408.67344" y="25.385813" transform="rotate(-0 408.67344 25.385813)">5 Verification</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(408.67344 33.232031)">critical fields checked</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(408.67344 40.88133)">against page images;</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(408.67344 48.530628)">conflicts → human</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(408.67344 56.179927)">review; patches logged</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(34.744 159.4594)">Source priority: machine-readable supplement &gt; supplementary table &gt; main-text table &gt; value in text &gt; calibrated figure digitisation.</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(69.9375 166.626)">Values shown only in graphs are digitised with axis calibration; uncalibrated visual estimates are never accepted.</text>
   </g>
  </g>
 </g>
