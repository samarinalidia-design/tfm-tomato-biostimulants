   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="18.48672" y="27.893933" transform="rotate(-0 18.48672 27.893933)">1  Literature search and screening</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 48.926951)">Crossref, Europe PMC, OpenAlex</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 56.57625)">39 627 records → 12 141 unique → 766 full texts</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 64.225548)">class A (tomato + stress + biostimulant): 399 studies</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="267.96672" y="27.893933" transform="rotate(-0 267.96672 27.893933)">1b  External test corpus</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(267.96672 48.926951)">publications first online 2024-2026</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(267.96672 56.57625)">same screening protocol, collected separately</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(267.96672 64.225548)">108 records → 80 in scope → 58 closed</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="18.48672" y="111.861773" transform="rotate(-0 18.48672 111.861773)">2  Extraction and verification (relational database)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 132.894791)">Docling text/table extraction → structured extraction of experiments, arms, stress, products and measurements</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 140.54409)">→ targeted human/AI verification of critical fields against page images (source receipts) → every value linked to its page/table/figure.</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 148.193388)">Two frozen databases: TRAIN_DEV (≤ 2023, frozen 13 Nov 2026) and EXTERNAL_TEST (2024-2026, frozen 18 Nov 2026)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="18.48672" y="204.668333" transform="rotate(-0 18.48672 204.668333)">3  Analysis tables (V5, identical rules for TRAIN and TEST)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 225.701351)">source-verified corrections (size fractions, measurement year, stress classes, unknown hybrid status) → effect sizes lnRR</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 233.35065)">→ missing SDs imputed from the mean CV of TRAIN studies (Nakagawa et al. 2023) → shared controls and dependency clusters</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 240.999948)">TRAIN: yield 831 contrasts / 76 studies; dry biomass 1452 / 172.  TEST: yield 117 / 16; dry biomass 378 / 31</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="18.48672" y="297.474893" transform="rotate(-0 18.48672 297.474893)">4a  Meta-analysis (average effects)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 318.507911)">three-level random-effects model</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 326.15721)">(study / experiment / contrast)</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 333.806508)">pooled effect, heterogeneity, subgroups,</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 341.455807)">meta-regression, stress gradient,</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 349.105105)">interactions S×B and A×B,</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 356.754403)">publication bias, influence</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="267.96672" y="297.474893" transform="rotate(-0 267.96672 297.474893)">4b  Prediction (new studies)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(267.96672 318.507911)">baselines vs Ridge / Random Forest / stacks</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(267.96672 326.15721)">nested CV grouped by dependency cluster</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(267.96672 333.806508)">pre-specified selection rule</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(267.96672 341.455807)">MODEL FREEZE → one TEST evaluation</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(267.96672 349.105105)">(POST_HOC_TEST_REUSE)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="18.48672" y="410.168573" transform="rotate(-0 18.48672 410.168573)">5  Additional checks (TRAIN only or simulated data)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 431.201591)">learning curves · applicability domain · selective prediction · choice between biostimulants</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(18.48672 438.85089)">sensitivity to data-preparation decisions · simulation with known truth</text>
   </g>
  </g>
 </g>
