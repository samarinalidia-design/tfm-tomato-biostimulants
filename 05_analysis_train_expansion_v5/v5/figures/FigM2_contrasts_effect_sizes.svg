   <g id="text_8">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="152.208" y="237.37536" transform="rotate(-0 152.208 237.37536)">S×B interaction = ln(SB/S) − ln(B/C)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="334.3284" y="26.9568" transform="rotate(-0 334.3284 26.9568)">Effect size (log response ratio)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 47.064311)">lnRR = ln(mean treated / mean reference)</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 54.949161)">effect (%) = 100 × (e^lnRR − 1)</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 62.834011)">lnRR = 0.37 ≈ +45 %;  lnRR = −0.22 ≈ −20 %</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 70.718861)"/>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 78.603711)">sampling variance</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 86.488561)">v = CV_t²/n_t + CV_c²/n_c   (CV = SD/mean)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="334.3284" y="155.2608" transform="rotate(-0 334.3284 155.2608)">Two biostimulants A and B</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 175.368311)">A×B = ln(AB) − ln(A) − ln(B) + ln(C)</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 183.253161)">&gt; 0 synergy · ≈ 0 additive · &lt; 0 antagonism</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 191.138011)"/>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 199.022861)">Contrasts used for prediction:</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(334.3284 206.907711)">SB vs S (stressed) and B vs C (no stress)</text>
   </g>
  </g>
