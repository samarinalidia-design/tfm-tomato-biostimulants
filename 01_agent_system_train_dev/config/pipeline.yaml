  primary: FRUIT_YIELD
  secondary: DRY_BIOMASS
  candidate_terms:
  - yield
  - harvest
  - harvested fruit mass
  - fruit production
  - crop production
  - crop productivity
  - fruit productivity
  - total fruit weight
  - total fruit fresh weight
  - cumulative fruit mass
  - marketable production
  - marketable fruit weight
  - commercial yield
  - economic yield
  - early production
  - fruit mass per plant
  - harvested mass per plot
  - rendimiento
