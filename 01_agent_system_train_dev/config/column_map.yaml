# Canonical field -> list of candidate headers in the working workbook
# (TFM_DATABASE_CLASS_A_WORKING.xlsx, schema 3.6.2-A-LEAN).
# The first candidate that exists wins; if none exists the resolver tries a
# unique case-insensitive prefix match and reports it in `tfm.py check-columns`.
# Fix names HERE if check-columns reports a miss — never in code.

studies:
  study_id: [study_id]
  doi: [doi]
  title: [title]
  authors: [authors]
  year: [year]
  journal: [journal]
  publication_type: [publication_type]
  class_final: [class_final]
  dataset_role: [dataset_role]
  first_publication_date: [first_publication_date]
  temporal_eligibility: [temporal_eligibility]

files:
  file_key: [file_key]
  study_id: [study_id]
  role: [role]
  active_file_id: [active_file_id, active_drive_file_id]
  active_name: [active_file_name, active_name]
  mime_type: [mime_type]

experiments:
  experiment_id: [experiment_id]
  study_id: [study_id]
  cultivar: [cultivar]
  growth_stage: [growth_stage]
  system: [system]
  substrate: [substrate]
  season: [season]
  country: [country]

experiment_context:
  experiment_id: [experiment_id]
  study_id: [study_id]

genotype_context:
  experiment_id: [experiment_id]
  study_id: [study_id]

arms:
  arm_id: [arm_id]
  experiment_id: [experiment_id]
  arm_label: [arm_label]
  arm_role: [arm_role]

stress_factors:
  stress_factor_id: [stress_factor_id]
  study_id: [study_id]
  experiment_id: [experiment_id]
  arm_id: [arm_id]

arm_components:
  component_id: [component_id, arm_component_id]
  arm_id: [arm_id]
  experiment_id: [experiment_id]

measurements:
  measurement_id: [measurement_id]
  experiment_id: [experiment_id]
  arm_id: [arm_id]
  outcome_raw: [outcome_raw_name, outcome_raw]
  outcome_std: [outcome_standard_name, outcome_std, outcome_id]
  outcome_family: [outcome_family]
  organ: [organ]
  timepoint: [timepoint_raw, timepoint]
  mean: [mean]
  sd: [sd]
  se: [se]
  n: [n]
  unit_raw: [unit_raw]
  unit: [unit]
  provenance_id: [provenance_id]
  verification_status: [verification_status]

outcome_dictionary:
  outcome_std: [outcome_standard_name, outcome_std, outcome_id]
  target_role: [target_role]

endpoint_measurement_context:
  measurement_id: [measurement_id]
  endpoint_role: [endpoint_scope, endpoint_role]

provenance_qa:
  provenance_id: [provenance_id]
  entity_type: [entity_type]
  entity_id: [entity_id]
  source_file_id: [source_file_id]

study_relations:
  study_a: [study_id_a, study_a]
  study_b: [study_id_b, study_b]
  relation: [relation_type, relation]
